[project]
name = "opds-tui"
version = "0.1.0"
description = "Browse OPDS ebook catalogs from the terminal (TUI and CLI)"
readme = "README.md"
authors = [
    { name = "Yurii Tereshchenko", email = "yurii.tereshchenko.w@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "platformdirs>=4.12.3",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.scripts]
opds-tui = "opds_tui:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/opds_tui/cli.py" = ["B008", "B904"]
